---
# Service para acessar MinIO externo (Docker)
# Isso permite que o KServe acesse o MinIO rodando no Docker
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: default
spec:
  type: ExternalName
  externalName: host.minikube.internal
  ports:
    - port: 9000
      targetPort: 9000
---
